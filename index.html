function go(p){page=p;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();let [a,...tail]=b.dataset.action.split(':'),v=tail.join(':');if(a==='nav')go(v);if(a==='filter'){filter=v;render()}if(a==='open'){selected=+v;go('Карточка')}if(a==='detail'||a==='cancel')go('Карточка');if(a==='edit'){draft=structuredClone(tasks.find(t=>t.id===selected));step=0;go('Проверка')}if(a==='back'){step--;render()}if(a==='crm')go('CRM');if(a==='done'||a==='resume'){tasks.find(t=>t.id===selected).state=a==='done'?'done':'active';save();render();toast('Статус сохранён в макете')}if(a==='listen'){if(!('speechSynthesis'in window))return toast('Озвучка недоступна в этом браузере');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(tasks.find(t=>t.id===selected).quote);u.lang='ru-RU';speechSynthesis.speak(u)}if(a==='source'){meetingSource=v;go('Добавление')}if(a==='meeting-result'){let item=mine().find(t=>t.source==='Google Meet');if(item){selected=item.id;go('Карточка')}else{meetingSource='Google Meet';go('Добавление')}}if(a==='connect'){connected[v]=!connected[v];render();toast('Демонстрационное подключение обновлено')}if(a==='remind'){go('Напоминания');toast('Выберите карточку, чтобы отложить напоминание')}if(a==='snooze'){b.textContent='Отложено на час';b.disabled=true;toast('Напоминание отложено в макете')}if(a==='access'){accessName=v;go('Доступ')}});
document.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(e.target.id==='wizard'){if(step<2){for(let [k,v]of f)draft[k]=v;step++;render()}else{draft.state='active';draft.crm=true;draft.dept=getTeamMember(draft.person)?.department||(draft.person==='Денис Орлов'?'Сопровождение':'Продажи');tasks[tasks.findIndex(t=>t.id===selected)]=draft;save();go('Карточка');toast('Сохранено. В макете одна задача Bitrix24.')}}if(e.target.id==='sourceform'){let id=Date.now();tasks.unshift({...structuredClone(initial[0]),id,title:String(f.get('name')),source:meetingSource,quote:String(f.get('text')||initial[0].quote),time:'Только что'});save();selected=id;go('Карточка');toast('Показан демонстрационный результат, анализ не запускался')}if(e.target.id==='accessform'){accessScopes[accessName]=String(f.get('scope'));go('Команда');toast('Доступ сохранён в макете')}if(e.target.id==='memberform'){members.push(String(f.get('name')));render();toast('Приглашение DEMO-123 создано. Отправка отключена.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
$('#role').onchange=e=>{role=e.target.value;go('Работа')};$('#reset').onclick=()=>{tasks=structuredClone(initial);save();filter='Все';query='';go('Работа');toast('Демонстрационные задачи восстановлены')};render();
